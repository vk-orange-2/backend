version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: config-platform-postgres
    environment:
      POSTGRES_DB: config_platform
      POSTGRES_USER: config_user
      POSTGRES_PASSWORD: config_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U config_user -d config_platform"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: