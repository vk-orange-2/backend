global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: config-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - config-server:8081

  - job_name: centrifugo
    metrics_path: /metrics
    static_configs:
      - targets:
          - centrifugo:8000
