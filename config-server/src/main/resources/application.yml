server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/config_platform
    username: config_user
    password: config_pass
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration