server:
  port: 8081
  tomcat:
    connection-timeout: 5s

spring:
  application:
    name: config-server

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:config_platform}
    username: ${DB_USER:config_user}
    password: ${DB_PASSWORD:config_pass}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      validation-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        generate_statistics: true
        jdbc:
          batch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    async:
      request-timeout: 10s

config_platform:
  jwt:
    signingKey: ${JWT_SECRET:1234567890abcdefghijklmopqrstuxyz}
  apiKey:
    encryptionKey: ${API_KEY_ENCRYPTION_KEY:1234567890123456}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true

  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99

  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      type: B3

  observations:
    key-values:
      application: config-server
    http:
      server:
        requests-name: true
    jdbc:
      queries:
        enabled: true

  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

logging:
  pattern:
    level: "%5p [${spring.application.name:},traceId=%X{traceId},spanId=%X{spanId}]"

  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.transaction.interceptor: TRACE

decorator:
  datasource:
    enabled: true
    query:
      log-level: INFO
      enable-observability: true

