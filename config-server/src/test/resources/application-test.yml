spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  flyway:
    enabled: false

config_platform:
  jwt:
    signingKey: test-jwt-signing-key-for-testing-purposes-only
  apiKey:
    encryptionKey: 12345678901234567890123456789012

scheduler:
  enabled: false

rate-limit:
  user:
    write:
      rate: 0
      burst: 10
    read:
      rate: 0
      burst: 10
  service-account:
    write:
      rate: 0
      burst: 10
    read:
      rate: 0
      burst: 10
  ip:
    write:
      rate: 0
      burst: 10
    read:
      rate: 0
      burst: 10
